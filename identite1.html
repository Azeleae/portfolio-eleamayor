<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>la boulange - Portfolio Éléa</title>
    <!-- Polices Google Fonts : Montserrat & Figtree -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800;900&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="identite1.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <a href="portfolio.html" class="home-icon" aria-label="Accueil">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </a>

        <nav class="nav-links">
            <a href="contact.html" data-fr="Contact" data-en="Contact">Contact</a>
            <span>•</span>
            <a href="presentation.html" data-fr="Présentation" data-en="About">Présentation</a>
            <span>•</span>
            <a href="cv-video.html" data-fr="CV vidéo" data-en="Video Resume">CV vidéo</a>
        </nav>

        <div class="nav-controls">
            <button id="lang-toggle" class="control-btn" aria-label="Changer de langue">
                <span id="lang-fr" class="lang-option active">FR</span>
                <span class="lang-divider">|</span>
                <span id="lang-en" class="lang-option">EN</span>
            </button>
            <button id="theme-toggle" class="control-btn theme-icon" aria-label="Changer de thème">⏾</button>
        </div>
    </header>

    <!-- Titre déroulant "la boulange" avec flèche -->
    <div class="edition-title-container">
        <div class="dropdown-header" id="dropdownToggle">
            <h1 class="page-title">la boulange</h1>
            <span class="arrow-icon">▼</span>
        </div>
        
        <ul class="dropdown-menu" id="dropdownMenu">
            <li><a href="identitevisuelle.html" data-fr="Retour Identité visuelle" data-en="Back to Visual Identity">Retour Identité visuelle</a></li>
        </ul>
    </div>

    <!-- Contenu Pleine Largeur pour l'image de montage -->
    <main class="project-fullscreen-content">
        <div class="montage-container">
            <!-- Remplace "montage_boulange.png" par le nom exact de ton image de montage -->
            <img src="montage_boulange.png" alt="Montage La Boulange" class="montage-image" onerror="this.src='https://via.placeholder.com/1920x3000/ff8fab/ffffff?text=Image+de+montage+La+Boulange'">
        </div>

        <!-- Bouton Retour -->
        <div class="back-button-container">
            <a href="identitevisuelle.html" class="back-btn" data-fr="retourner à l'identité visuelle" data-en="back to visual identity">retourner à l'identité visuelle</a>
        </div>
    </main>

    <script>
        // --- 1. Menu Déroulant ---
        const dropdownToggle = document.getElementById('dropdownToggle');
        const dropdownMenu = document.getElementById('dropdownMenu');

        dropdownToggle.addEventListener('click', () => {
            dropdownToggle.classList.toggle('active');
            dropdownMenu.classList.toggle('open');
        });

        dropdownMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                dropdownToggle.classList.remove('active');
                dropdownMenu.classList.remove('open');
            });
        });

        // --- 2. Synchronisation Langue & Mode Sombre ---
        const langToggleBtn = document.getElementById('lang-toggle');
        const langFr = document.getElementById('lang-fr');
        const langEn = document.getElementById('lang-en');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const translatableElements = document.querySelectorAll('[data-fr]');

        function applyLanguage(lang) {
            langEn.classList.toggle('active', lang === 'en');
            langFr.classList.toggle('active', lang === 'fr');
            translatableElements.forEach(el => {
                if(el.getAttribute(`data-${lang}`)) {
                    el.textContent = el.getAttribute(`data-${lang}`);
                }
            });
        }

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            document.body.classList.toggle('dark-mode', isDark);
            themeToggleBtn.textContent = isDark ? '☀︎' : '⏾';
        }

        let currentLang = localStorage.getItem('site_lang') || 'fr';
        let currentTheme = localStorage.getItem('site_theme') || 'light';

        applyLanguage(currentLang);
        applyTheme(currentTheme);

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            localStorage.setItem('site_lang', currentLang);
            applyLanguage(currentLang);
        });

        themeToggleBtn.addEventListener('click', () => {
            currentTheme = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
            localStorage.setItem('site_theme', currentTheme);
            applyTheme(currentTheme);
        });
    </script>
</body>
</html>
